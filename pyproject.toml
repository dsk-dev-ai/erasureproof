[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "erasureproof"
version = "1.1.2"
description = "Proof-of-erasure platform: find every copy of a person's data, prove deletion is complete, and issue signed attestations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Darshan Kachare" }]
keywords = [
  "gdpr",
  "ccpa",
  "erasure",
  "deletion",
  "privacy",
  "compliance",
  "data-protection",
  "right-to-be-forgotten",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "sqlalchemy>=2.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "pypdf>=4.0",
  "pillow>=10.0",
]

[project.urls]
Homepage = "https://erasureproof.onrender.com"
Documentation = "https://github.com/dsk-dev-ai/erasureproof#readme"
Repository = "https://github.com/dsk-dev-ai/erasureproof"
Changelog = "https://github.com/dsk-dev-ai/erasureproof/blob/main/CHANGELOG.md"
Issues = "https://github.com/dsk-dev-ai/erasureproof/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.4",
  "reportlab>=4.0",
  "cryptography>=42.0",
]
postgres = ["psycopg[binary]>=3.1"]
oidc = ["cryptography>=42.0"]
s3 = ["boto3>=1.34"]
temporal = ["temporalio>=1.5"]
intelligence = ["pypdf>=4.0", "pillow>=10.0"]

[project.scripts]
erasureproof = "erasureproof.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/erasureproof"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = [
  "B008",   # FastAPI Depends() in defaults is idiomatic
  "BLE001", # connector calls are deliberately defensive
  "UP017",  # datetime.UTC requires Python 3.11; keep 3.10 support
  "UP042",  # enum.StrEnum requires Python 3.11; keep 3.10 support
]
