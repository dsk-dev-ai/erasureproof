apiVersion: v1
kind: ConfigMap
metadata:
  name: erasureproof-config
  namespace: erasureproof
data:
  ERASUREPROOF_ENVIRONMENT: "production"
  ERASUREPROOF_AUTH_MODE: "api_key"
  ERASUREPROOF_DATA_DIR: "/data"
  ERASUREPROOF_EVIDENCE_DIR: "/data/evidence"
  ERASUREPROOF_LEDGER_PATH: "/data/ledger.jsonl"
  ERASUREPROOF_ATTESTATION_DIR: "/data/attestations"
  ERASUREPROOF_POLICY_DIR: "/app/policies"
  ERASUREPROOF_WEB_DIR: "/app/web/dist"
  ERASUREPROOF_DEFAULT_JURISDICTION: "gdpr"
  ERASUREPROOF_DEMO_ENABLED: "false"
  ERASUREPROOF_EXPOSURE_ENABLED: "false"
  ERASUREPROOF_REQUIRE_REMEDIATION_APPROVAL: "true"
  ERASUREPROOF_APPROVAL_REQUIRES_SEPARATE_USER: "true"
  ERASUREPROOF_APPROVAL_TTL_HOURS: "24"
  ERASUREPROOF_RATE_LIMIT_PER_MINUTE: "600"
  ERASUREPROOF_TRUST_PROXY_HEADERS: "true"
  ERASUREPROOF_SECURITY_HEADERS_ENABLED: "true"
  ERASUREPROOF_HSTS_SECONDS: "31536000"
  ERASUREPROOF_CORS_ORIGINS: "https://erasureproof.example.com"
  ERASUREPROOF_METRICS_ENABLED: "true"
  ERASUREPROOF_ACCESS_LOG_ENABLED: "true"
