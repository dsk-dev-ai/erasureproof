apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: erasureproof
  namespace: erasureproof
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: erasureproof
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8000
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8000
          protocol: TCP
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: database
      ports:
        - port: 5432
          protocol: TCP
    # OIDC discovery and JWKS refresh. Narrow this to your identity provider CIDRs.
    - ports:
        - port: 443
          protocol: TCP
