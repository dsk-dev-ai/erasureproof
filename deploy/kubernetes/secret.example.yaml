# Copy to secret.yaml, replace every value, and keep it out of version control.
apiVersion: v1
kind: Secret
metadata:
  name: erasureproof-secrets
  namespace: erasureproof
type: Opaque
stringData:
  # Use a managed PostgreSQL service with TLS and backups. SQLite is not supported
  # for multi-replica deployments.
  ERASUREPROOF_DATABASE_URL: "postgresql+psycopg://erasureproof:CHANGE_ME@postgres.example.internal:5432/erasureproof?sslmode=require"
  # Rotate this key through a secret manager. Changing it invalidates existing
  # attestation and backup signatures.
  ERASUREPROOF_ATTESTATION_KEY: "REPLACE_WITH_32_BYTE_RANDOM_SECRET"
  # JSON list of API keys. Use one key per operator and scope it to a tenant.
  # Never reuse the deployment administrator key for daily work.
  ERASUREPROOF_API_KEYS: >-
    [{"key":"REPLACE_WITH_ADMIN_KEY","role":"admin","tenant_id":"*","subject":"deployment-admin"},
     {"key":"REPLACE_WITH_TENANT_OPERATOR_KEY","role":"operator","tenant_id":"ten_example","subject":"tenant-operator"}]
  # Required for unauthenticated Prometheus scraping. Without it, /metrics falls
  # back to admin bearer authentication.
  ERASUREPROOF_METRICS_TOKEN: "REPLACE_WITH_METRICS_TOKEN"
