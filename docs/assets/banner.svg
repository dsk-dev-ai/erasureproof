<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">ErasureProof</title>
  <desc id="desc">Find every copy. Prove every deletion. Signed, evidence-backed deletion audits.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0a1a2e"/>
      <stop offset="1" stop-color="#06121f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.55" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#0369a1" stop-opacity="0.28"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#94a3b8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <circle cx="1030" cy="20" r="230" fill="url(#glow)" filter="url(#blur)"/>
  <circle cx="180" cy="300" r="190" fill="url(#glow)" filter="url(#blur)"/>

  <g transform="translate(78 68)">
    <rect width="184" height="184" rx="44" fill="url(#tile)" stroke="#5eead4" stroke-opacity="0.28"/>
    <path d="M92 34 L138 51 V92 C138 123 119 145 92 157 C65 145 46 123 46 92 V51 Z"
          fill="none" stroke="url(#accent)" stroke-width="8" stroke-linejoin="round"/>
    <path d="M70 94 L86 110 L117 74" fill="none" stroke="#f0fdfa" stroke-width="9"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="Manrope, Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="306" y="136" fill="#f8fafc" font-size="64" font-weight="700" letter-spacing="-2.5">ErasureProof</text>
    <text x="310" y="181" fill="#94a3b8" font-size="25" font-weight="500">Find every copy. Prove every deletion.</text>
    <g font-size="14" font-weight="600" letter-spacing="0.5">
      <rect x="310" y="212" width="152" height="34" rx="17" fill="#0f766e" fill-opacity="0.28" stroke="#5eead4" stroke-opacity="0.35"/>
      <text x="386" y="234" fill="#99f6e4" text-anchor="middle">SIGNED PROOF</text>
      <rect x="474" y="212" width="196" height="34" rx="17" fill="#0e7490" fill-opacity="0.22" stroke="#22d3ee" stroke-opacity="0.28"/>
      <text x="572" y="234" fill="#a5f3fc" text-anchor="middle">HASH-CHAINED LEDGER</text>
      <rect x="682" y="212" width="206" height="34" rx="17" fill="#0369a1" fill-opacity="0.22" stroke="#38bdf8" stroke-opacity="0.28"/>
      <text x="785" y="234" fill="#bae6fd" text-anchor="middle">GDPR · CCPA · DPDP</text>
    </g>
  </g>

  <g transform="translate(1024 60)">
    <rect width="104" height="36" rx="18" fill="#020617" fill-opacity="0.55" stroke="#94a3b8" stroke-opacity="0.24"/>
    <circle cx="20" cy="18" r="4" fill="#2dd4bf"/>
    <text x="34" y="23" fill="#cbd5e1" font-family="JetBrains Mono, ui-monospace, monospace" font-size="13" font-weight="600">v1.1.2</text>
  </g>
</svg>
