name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: erasureproof
            path: .
          - package: erasureproof-sdk
            path: sdk/python
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PACKAGE_PATH: ${{ matrix.path }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import tomllib

          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          path = pathlib.Path(os.environ["PACKAGE_PATH"]) / "pyproject.toml"
          version = tomllib.loads(path.read_text(encoding="utf-8"))["project"]["version"]
          if version != tag:
              raise SystemExit(f"tag {tag} does not match {path} version {version}")
          PY
      - name: Build sdist and wheel
        run: uv build --out-dir dist "${{ matrix.path }}"
      - name: Check package metadata
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-dist
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish ${{ matrix.package }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: erasureproof
          - package: erasureproof-sdk
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.package }}-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          attestations: true
